[rocksdb]
url = "https://github.com/facebook/rocksdb"
tag = "v11.13.2"
build = "cmake"
cxx_std = 20
c = "kiln"
configure = ["-DWITH_TESTS=ON", "-DWITH_ALL_TESTS=ON", "-DROCKSDB_BUILD_SHARED=OFF", "-DWITH_GFLAGS=OFF", "-DWITH_LIBURING=OFF", "-DWITH_SNAPPY=OFF", "-DWITH_LZ4=OFF", "-DWITH_ZLIB=OFF", "-DWITH_ZSTD=OFF", "-DWITH_BZ2=OFF", "-DWITH_BENCHMARK_TOOLS=OFF", "-DWITH_TOOLS=OFF", "-DWITH_CORE_TOOLS=OFF", "-DWITH_TRACE_TOOLS=OFF", "-DFAIL_ON_WARNINGS=OFF", "-DPORTABLE=1", "-DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST"]
build_targets = ["rocksdb", "c_test", "arena_test", "autovector_test", "block_based_table_reader_test", "block_test", "bloom_test", "cache_test", "coding_test", "comparator_db_test", "compaction_iterator_test", "crc32c_test", "data_block_hash_index_test", "db_basic_test", "db_iterator_test", "db_properties_test", "dbformat_test", "defer_test", "env_basic_test", "filename_test", "full_filter_block_test", "hash_table_test", "hash_test", "heap_test", "inlineskiplist_test", "log_test", "lru_cache_test", "memtable_list_test", "merge_test", "options_test", "rate_limiter_test", "ribbon_test", "skiplist_test", "slice_test", "table_test", "thread_local_test", "timer_test", "version_edit_test", "work_queue_test", "write_batch_test", "write_controller_test"]
# One ctest test per test program (gtest_discover_tests would make one per
# case): whole/CTestTestfile.cmake runs each built program once, under the
# cross build's emulator if any, each with a TEST_TMPDIR of its own (programs
# running at once in one TEST_TMPDIR remove each other's databases), in a
# fresh directory under /tmp removed afterwards: on the workspace's bind
# mount comparator_db_test and db_iterator_test fail opening their DB
# directory ("While open directory: ... No such file or directory"), with
# either back end, and pass on the container's file system.
test = "tt=$(mktemp -d /tmp/hod-oss-rocksdb-XXXXXX) && mkdir -p whole && emu=$(sed -n 's/^CMAKE_CROSSCOMPILING_EMULATOR:[A-Z]*=//p' CMakeCache.txt | tr ';' ' ') && for t in c_test arena_test autovector_test block_based_table_reader_test block_test bloom_test cache_test coding_test comparator_db_test compaction_iterator_test crc32c_test data_block_hash_index_test db_basic_test db_iterator_test db_properties_test dbformat_test defer_test env_basic_test filename_test full_filter_block_test hash_table_test hash_test heap_test inlineskiplist_test log_test lru_cache_test memtable_list_test merge_test options_test rate_limiter_test ribbon_test skiplist_test slice_test table_test thread_local_test timer_test version_edit_test work_queue_test write_batch_test write_controller_test; do if [ -x \"$t\" ]; then mkdir -p \"$tt/$t\" && echo \"add_test($t $emu $PWD/$t)\" && echo \"set_tests_properties($t PROPERTIES ENVIRONMENT TEST_TMPDIR=$tt/$t)\"; fi; done > whole/CTestTestfile.cmake && (cd whole && ctest --output-on-failure --timeout 2400); rc=$?; rm -rf \"$tt\"; exit $rc"
test_timeout = 10800
# Each test thread gets a glibc malloc arena (up to 128 MB of address space
# each): under 3 GB c_test cannot start its threads, in the control too.
test_vmem_kb = 16000000
notes = "WP-211. The static library (all of RocksDB: LSM tree, memtables, block-based tables, caches, filters, compaction) and 40 of its ~220 test programs (unit tests of the util/, memory/, table/, cache/ and options/ layers, and the DB-level db_basic_test, db_iterator_test, db_properties_test, comparator_db_test, merge_test), each program run once as one test; c_test is C through kiln-cc. No compression libraries (not on the machine), no tools; PORTABLE=1 (no -march=native; AArch64 still gets +crc+crypto)."

[cmake]
url = "https://github.com/Kitware/CMake"
tag = "v4.5.0"
build = "cmake"
cxx_std = 17
# C through clang-19: kiln's C driver rejects a typedef name that is also a
# struct tag (bundled curl's lib/cf-h1-proxy.c, h1_tunnel_state), and CMake
# forces curl's proxy support on; every other bundled C TU took kiln.
c = "clang"
configure = ["-DBUILD_TESTING=ON", "-DCMAKE_USE_OPENSSL=OFF", "-DBUILD_CursesDialog=OFF", "-DBUILD_QtDialog=OFF", "-DCMAKE_USE_SYSTEM_LIBRARIES=OFF"]
# The unit tests (CMakeLib.*: one program, CMakeLibTests; kwsys.*), and the
# RunCMake script tests of the language's commands, which run the built
# cmake and ctest (try_compile and ctest_test also compile and run small
# projects with the configured compilers, through the lane's wrappers).
test = "ctest --output-on-failure -j4 -R '^(CMakeLib\\.|kwsys\\.|RunCMake\\.(string|list|math|if|while|foreach|function|block|set|configure_file|cmake_language|cmake_parse_arguments|get_property|set_property|separate_arguments|message|return|try_compile|CommandLine|CTestCommandLine|ctest_test|cmake_path)$)'"
test_timeout = 7200
notes = "WP-211. CMake itself (cmake, ctest, cpack and the CMakeLib unit tests) with its bundled C libraries (curl without TLS, libarchive, zlib, zstd, liblzma, bzip2, nghttp2, expat, libuv: C through clang-19, as kiln's C driver rejects curl's lib/cf-h1-proxy.c) and C++ ones (jsoncpp, cppdap); configured by the system cmake (no bootstrap). Tests: CMakeLib.*, kwsys.* and 24 RunCMake command suites (string, list, math, if, ... try_compile, ctest_test, cmake_path)."

[opencv]
url = "https://github.com/opencv/opencv"
tag = "4.14.0"
build = "cmake"
cxx_std = 17
c = "kiln"
configure = ["-DBUILD_LIST=core,imgproc,ts", "-DBUILD_TESTS=ON", "-DBUILD_PERF_TESTS=OFF", "-DBUILD_EXAMPLES=OFF", "-DBUILD_opencv_apps=OFF", "-DBUILD_DOCS=OFF", "-DBUILD_JAVA=OFF", "-DBUILD_opencv_python3=OFF", "-DBUILD_ZLIB=ON", "-DWITH_IPP=OFF", "-DWITH_ITT=OFF", "-DWITH_OPENCL=OFF", "-DWITH_LAPACK=OFF", "-DWITH_EIGEN=OFF", "-DWITH_PROTOBUF=OFF", "-DWITH_KLEIDICV=OFF", "-DWITH_OPENMP=OFF", "-DWITH_TBB=OFF", "-DWITH_VA=OFF", "-DWITH_GTK=OFF", "-DWITH_QT=OFF", "-DWITH_FFMPEG=OFF", "-DWITH_GSTREAMER=OFF", "-DWITH_V4L=OFF", "-DWITH_ADE=OFF", "-DOPENCV_GENERATE_PKGCONFIG=OFF", "-DWITH_JPEG=OFF", "-DWITH_PNG=OFF", "-DWITH_SPNG=OFF", "-DWITH_WEBP=OFF", "-DWITH_TIFF=OFF", "-DWITH_OPENJPEG=OFF", "-DWITH_JASPER=OFF", "-DWITH_OPENEXR=OFF", "-DWITH_AVIF=OFF", "-DWITH_JPEGXL=OFF", "-DWITH_GDAL=OFF", "-DWITH_GDCM=OFF"]
# The image codec libraries (libjpeg-turbo, libpng, libwebp, ...) serve
# imgcodecs only, which BUILD_LIST leaves out: off (kiln rejects their NEON
# kernels and one libwebp C conversion, findings KILN-LIMITS-3.md 8-9).
