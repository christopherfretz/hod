name: ci-lane
# One architecture's half of the merge gate (docs/VALIDATION.md "Hosted
# CI", spec/harness.md "CI"), called by ci.yml once per runner, after
# kiln's ci-lane.yml. Every job runs in the same Debian 13 container as the
# development container (buildpack-deps:trixie: Debian's GCC 14, git and
# curl; the hod-ci action adds LLVM 19 and 22 and the rest), so the clang,
# llc and binutils versions are the same packages there and here.
on:
  workflow_call:
    inputs:
      runner: { type: string, required: true }
      # rust-cache's shared-key: one cache per architecture.
      cache-key: { type: string, required: true }
permissions:
  contents: read
# A missing tool (an LLVM tool, a linker, a debugger, the other
# architecture's cross toolchain or emulator, kiln++) is a test failure,
# never a skip (docs/VALIDATION.md "Oracles").
env:
  HOD_REQUIRE_TOOLS: "1"
  CARGO_TERM_COLOR: never
defaults:
  run: { shell: bash }
jobs:
  # kiln++ at the pinned revision, built once per revision and
  # architecture and kept in the Actions cache (the kiln action); the
  # other jobs restore it.
  kiln:
    name: kiln
    runs-on: ${{ inputs.runner }}
    container: buildpack-deps:trixie
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hod-ci
        with: { cache-key: "${{ inputs.cache-key }}" }
      - uses: ./.github/actions/kiln
        with: { build: "true" }
  # The quick gate (`cargo xtask ci --quick`), one job per step group so
  # they run in parallel: every step but `roundtrip`, which needs the
  # corpus, build output of the development machine that a hosted runner
  # does not have (spec/harness.md "CI"; xtask::ci::HOSTED_STEPS, checked
  # against this file by `the_hosted_lane_runs_the_quick_gates_steps`).
  lints:
    name: lints
    runs-on: ${{ inputs.runner }}
    container: buildpack-deps:trixie
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hod-ci
        with: { cache-key: "${{ inputs.cache-key }}" }
      - run: cargo xtask ci --quick --step fmt
      - run: cargo xtask ci --quick --step clippy
  # The test step in parts (xtask::ci::TEST_PARTS, checked against this
  # file by `the_hosted_lane_runs_the_quick_gates_steps`), one job each,
  # so that no job runs much over 15 minutes; `rest` is every package the
  # other parts do not name. The debugger tests trace their programs with
  # gdb and lldb: CAP_SYS_PTRACE (Docker's default seccomp profile allows
  # ptrace; `personality` is blocked, so the debuggers leave ASLR on). The
  # `harness` part (xtask, which builds the most) saves the cargo cache.
  test:
    name: test ${{ matrix.part }}
    needs: [kiln]
    runs-on: ${{ inputs.runner }}
    container:
      image: buildpack-deps:trixie
      # No core files: a test's crashing program ends with its signal's
      # own status, as in the development container.
      options: --cap-add=SYS_PTRACE --ulimit core=0
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [a64, x64, harness, front, rest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hod-ci
        with:
          cache-key: "${{ inputs.cache-key }}"
          save-cache: "${{ matrix.part == 'harness' }}"
      - uses: ./.github/actions/kiln
      # WP-229: on the x86-64 lane the AVX-512 execution tests of the `x64`
      # part run natively when this runner's processor has the features
      # (hod_testutil::avx512), and write one line per program to the
      # report; the last step writes it to the job's summary and its log. The lane
      # does not set HOD_REQUIRE_AVX512: the hosted runners are a mixed
      # fleet, and one without AVX-512 skips (spec/harness.md "CI" 8).
      - name: avx512 report
        if: matrix.part == 'x64' && runner.arch == 'X64'
        run: |
          rm -f "$RUNNER_TEMP/avx512-report.tsv"
          echo "HOD_AVX512_REPORT=$RUNNER_TEMP/avx512-report.tsv" >> "$GITHUB_ENV"
      - run: cargo xtask ci --quick --step test --part ${{ matrix.part }}
      - name: avx512 execution summary
        if: always() && matrix.part == 'x64' && runner.arch == 'X64'
        run: scripts/avx512-summary.sh "$RUNNER_TEMP/avx512-report.tsv" | tee -a "$GITHUB_STEP_SUMMARY"
  # A random-program job goes here when `cargo xtask fuzz` (WP-154,
  # csmith; the hod-ci action installs the package) is on main: a fixed
  # seed range per run, every program compiled by hod and by llc and run
  # natively, a difference a failure (spec/harness.md "CI").
  irdiff:
    name: irdiff
    runs-on: ${{ inputs.runner }}
    container: buildpack-deps:trixie
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hod-ci
        with: { cache-key: "${{ inputs.cache-key }}" }
      - run: cargo xtask ci --quick --step irdiff
