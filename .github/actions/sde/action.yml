name: sde
description: >
  Intel's Software Development Emulator (SDE) as the runner of the AVX-512
  execution tests on an x86-64 runner (WP-238, spec/harness.md "CI" item
  8): one pinned version, downloaded from Intel's download mirror, its
  sha256 checked against the one Intel publishes on the download page, and
  kept in the Actions cache under the version. It sets
  HOD_X64_AVX512_RUNNER to `sde64 -<chip> --` and
  HOD_X64_AVX512_RUNNER_CPUINFO to a file of the emulated processor's flags
  (cpu-flags.c run under the emulator), so that a test runs a program
  natively when this runner's processor has its features and under the
  emulator when only the emulated one has them (hod_testutil::avx512).
  Intel SDE is "free of charge for any type of use" under the Intel
  Simplified Software License (its terms are in the kit's Licenses
  directory); it is used unmodified and not redistributed.
inputs:
  chip:
    description: >
      The processor SDE emulates (`sde64 -help`): `spr`, Sapphire Rapids,
      has every feature of the zmm grid's machines but Knights Landing's
      ER and PF (no SDE emulates those) and every one the x86_avx512
      drivers check (FP16 and BF16 included).
    required: false
    default: spr
runs:
  using: composite
  steps:
    - id: kit
      name: SDE's version
      shell: bash
      run: |
        # Pinned: Intel SDE 10.13.1 (2026-07-28), Linux kit; the sha256 is
        # the one on Intel's download page (download 684897).
        {
          echo "name=sde-external-10.13.1-2026-07-28-lin"
          echo "url=https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz"
          echo "sha256=94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50"
        } >> "$GITHUB_OUTPUT"
    - id: cache
      uses: actions/cache/restore@v4
      with:
        path: /opt/sde
        key: sde-${{ steps.kit.outputs.sha256 }}-${{ runner.arch }}
    - if: steps.cache.outputs.cache-hit != 'true'
      name: download SDE
      shell: bash
      env:
        URL: ${{ steps.kit.outputs.url }}
        SHA256: ${{ steps.kit.outputs.sha256 }}
        NAME: ${{ steps.kit.outputs.name }}
      run: |
        kit="$RUNNER_TEMP/$NAME.tar.xz"
        curl -sSfL --retry 3 -o "$kit" "$URL"
        echo "$SHA256  $kit" | sha256sum -c -
        mkdir -p /opt/sde
        tar -xJf "$kit" -C /opt/sde --strip-components=1
        rm -f "$kit"
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: /opt/sde
        key: sde-${{ steps.kit.outputs.sha256 }}-${{ runner.arch }}
    - name: HOD_X64_AVX512_RUNNER
      shell: bash
      env: { CHIP: "${{ inputs.chip }}" }
      run: |
        flags="$RUNNER_TEMP/sde-cpu-flags"
        cpuinfo="$RUNNER_TEMP/sde-cpuinfo"
        cc -O1 -Wall -Werror "$GITHUB_ACTION_PATH/cpu-flags.c" -o "$flags"
        /opt/sde/sde64 -version | head -3
        time /opt/sde/sde64 "-$CHIP" -- "$flags" "Intel SDE -$CHIP" > "$cpuinfo"
        cat "$cpuinfo"
        grep -q ' avx512f' "$cpuinfo" || { echo "SDE -$CHIP has no avx512f" >&2; exit 1; }
        echo "HOD_X64_AVX512_RUNNER=/opt/sde/sde64 -$CHIP --" >> "$GITHUB_ENV"
        echo "HOD_X64_AVX512_RUNNER_CPUINFO=$cpuinfo" >> "$GITHUB_ENV"
