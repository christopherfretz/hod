name: ci-lane
# One architecture's half of the merge gate (docs/VALIDATION.md "Hosted
# CI", spec/harness.md "CI"), called by ci.yml once per runner, after
# kiln's ci-lane.yml. Every job runs in the same Debian 13 container as the
# development container (buildpack-deps:trixie: Debian's GCC 14, git and
# curl; the hod-ci action adds LLVM 19 and 22 and the rest), so the clang,
# llc and binutils versions are the same packages there and here.
on:
  workflow_call:
    inputs:
      runner: { type: string, required: true }
      # rust-cache's shared-key: one cache per architecture.
      cache-key: { type: string, required: true }
permissions:
  contents: read
# A missing tool (an LLVM tool, a linker, a debugger, the other
# architecture's cross toolchain or emulator, kiln++) is a test failure,
# never a skip (docs/VALIDATION.md "Oracles").
env:
  HOD_REQUIRE_TOOLS: "1"
  CARGO_TERM_COLOR: never
defaults:
  run: { shell: bash }
jobs:
  # kiln++ at the pinned revision, built once per revision and
  # architecture and kept in the Actions cache (the kiln action); the
  # other jobs restore it.
  kiln:
    name: kiln
    runs-on: ${{ inputs.runner }}
    container: buildpack-deps:trixie
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hod-ci
        with: { cache-key: "${{ inputs.cache-key }}" }
      - uses: ./.github/actions/kiln
        with: { build: "true" }
  # The quick gate (`cargo xtask ci --quick`), one job per step group so
  # they run in parallel: every step but `roundtrip`, which needs the
  # corpus, build output of the development machine that a hosted runner
  # does not have (spec/harness.md "CI"; xtask::ci::HOSTED_STEPS, checked
  # against this file by `the_hosted_lane_runs_the_quick_gates_steps`).
  # The debugger tests trace their programs with gdb and lldb:
  # CAP_SYS_PTRACE (Docker's default seccomp profile allows ptrace;
  # `personality` is blocked, so the debuggers leave ASLR on). This job
  # builds the most and saves the cargo cache.
  test:
    name: test
    needs: [kiln]
    runs-on: ${{ inputs.runner }}
    container:
      image: buildpack-deps:trixie
      # No core files: a test's crashing program ends with its signal's
      # own status, as in the development container.
      options: --cap-add=SYS_PTRACE --ulimit core=0
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/hod-ci
        with: { cache-key: "${{ inputs.cache-key }}", save-cache: "true" }
      - uses: ./.github/actions/kiln
      - run: |
          fail=0
          cargo test -q -p hod_cli --test kiln_e2e || fail=1
          cargo test -q -p hod_x64 --test fpintr || fail=1
          cargo test -q -p xtask --test debug_m3 --test debug_post_index || fail=1
          cargo test -q -p xtask --test debug_real -- --include-ignored quick_tier_matches_llc || fail=1
          cargo test -q -p xtask --test debug_post_index -- --ignored || echo "expected: the ignored x86-64 line finding fails"
          exit $fail
