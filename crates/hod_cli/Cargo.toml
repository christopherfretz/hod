[package]
name = "hod_cli"
description = "The hod command-line tool (llc-compatible)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "hod"
path = "src/main.rs"

[dependencies]
hod.workspace = true
hod_ll.workspace = true

[dev-dependencies]
# The vocabulary of reasons, for tests that check a reason's shape.
hod_ir.workspace = true
# The kiln end-to-end test links hod's objects with the object tests' toolchain.
hod_obj.workspace = true
hod_testutil.workspace = true
# The kiln end-to-end test builds its shim with the harness's own code.
xtask.workspace = true

[lints]
workspace = true
